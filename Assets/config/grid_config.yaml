behaviors:
  GridBrain:
    trainer_type: ppo
    max_steps: 5000000
    time_horizon: 512
    summary_freq: 5000
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3e-4
      beta: 0.05
      epsilon: 0.05
    network_settings:
      num_layers: 2
      hidden_units: 256
      normalize: false
      vis_encoder_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
