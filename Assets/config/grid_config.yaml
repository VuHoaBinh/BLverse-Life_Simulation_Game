behaviors:
  GridBrain:
    trainer_type: ppo
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 5000
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1e-5
      beta: 0.05
      epsilon: 0.05
    network_settings:
      num_layers: 2
      hidden_units: 256
      normalize: true
      vis_encoder_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.95
        strength: 0.5
